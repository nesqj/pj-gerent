<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- o celular não transforma e-mails e telefones em links sozinho (o app decide onde tem link) -->
    <meta name="format-detection" content="telephone=no, email=no, address=no, date=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // aplica o tema salvo antes de desenhar a página (evita piscar o tema errado)
      try {
        var p = JSON.parse(localStorage.getItem("gerenciador-precos-pref") || "null")
          || (JSON.parse(localStorage.getItem("gerenciador-precos-v1") || "{}").perfil) || {};
        var t = p.tema === "claro" ? "light"
          : p.tema === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (p.idioma) document.documentElement.lang = p.idioma;
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-title" content="PJ GERENT" />
    <meta name="application-name" content="PJ GERENT" />
    <title>PJ GERENT</title>
  </head>
  <body>
    <!-- logo no meio da tela desde o primeiro instante (o app substitui quando terminar de carregar) -->
    <style>
      #abertura { position: fixed; inset: 0; display: grid; place-items: center; background: #0a0a0a }
      #abertura img { width: min(180px, 50vw); max-height: 120px; object-fit: contain; animation: pulsa 1.6s ease-in-out infinite }
      #abertura .claro { display: none }
      [data-theme="light"] #abertura { background: #ffffff }
      [data-theme="light"] #abertura .escuro { display: none }
      [data-theme="light"] #abertura .claro { display: block }
      @keyframes pulsa { 0%, 100% { opacity: 1; transform: scale(1) } 50% { opacity: .55; transform: scale(.97) } }
      @media (prefers-reduced-motion: reduce) { #abertura img { animation: none } }
    </style>
    <div id="root"><div id="abertura"><img class="escuro" src="/logos/logo-escuro-menu.png" alt="" /><img class="claro" src="/logos/logo-claro-menu.png" alt="" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
